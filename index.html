<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Melo | Host & Join Local Social Gatherings</title>
    <!-- Meta tags for premium SEO -->
    <meta name="description" content="Discover and host trusted real-life gatherings in your neighborhood. Join small groups, dinner clubs, hiking trips, gaming nights, and startup meetups.">
    <meta name="theme-color" content="#2563EB">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <!-- Google Fonts - Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Main Stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- App Container -->
    <div id="app-container">
        <!-- Desktop Header & Sidebar Navigation -->
        <header id="app-header">
            <div class="header-content">
                <div class="logo-area" onclick="window.location.hash = '#home'">
                    <div class="logo-circle">
                        <i data-lucide="sparkles"></i>
                    </div>
                    <span class="logo-text">melo</span>
                </div>
                <nav class="desktop-nav">
                    <button class="nav-item active" data-tab="home" onclick="window.location.hash = '#home'">
                        <i data-lucide="home"></i> <span>Home</span>
                    </button>
                    <button class="nav-item" data-tab="explore" onclick="window.location.hash = '#explore'">
                        <i data-lucide="search"></i> <span>Explore</span>
                    </button>
                    <button class="nav-item action-btn" data-tab="create" onclick="window.location.hash = '#create'">
                        <i data-lucide="plus"></i> <span>Host Event</span>
                    </button>
                    <button class="nav-item" data-tab="saved" onclick="window.location.hash = '#saved'">
                        <i data-lucide="heart"></i> <span>Saved</span>
                    </button>
                    <button class="nav-item" data-tab="profile" onclick="window.location.hash = '#profile'">
                        <i data-lucide="user"></i> <span>Profile</span>
                    </button>
                    <!-- Notification Bell -->
                    <button class="icon-button" id="notif-bell" onclick="window.location.hash = '#notifications'">
                        <i data-lucide="bell"></i>
                        <span class="badge" id="notif-badge" style="display: none;">0</span>
                    </button>
                </nav>
            </div>
        </header>

        <!-- Main Content Area -->
        <main id="app-main">
            <div id="view-container">
                <!-- Dynamic views will render here -->
                <div class="skeleton-view">
                    <div class="skeleton skeleton-title"></div>
                    <div class="skeleton skeleton-text"></div>
                    <div class="skeleton skeleton-card"></div>
                </div>
            </div>
        </main>

        <!-- Mobile Bottom Navigation Bar -->
        <nav id="mobile-nav">
            <button class="mobile-nav-item active" data-tab="home" onclick="window.location.hash = '#home'">
                <i data-lucide="home"></i>
                <span class="nav-label">Home</span>
            </button>
            <button class="mobile-nav-item" data-tab="explore" onclick="window.location.hash = '#explore'">
                <i data-lucide="search"></i>
                <span class="nav-label">Explore</span>
            </button>
            <button class="mobile-nav-item center-plus" data-tab="create" onclick="window.location.hash = '#create'">
                <div class="plus-circle">
                    <i data-lucide="plus"></i>
                </div>
            </button>
            <button class="mobile-nav-item" data-tab="saved" onclick="window.location.hash = '#saved'">
                <i data-lucide="heart"></i>
                <span class="nav-label">Saved</span>
            </button>
            <button class="mobile-nav-item" data-tab="profile" onclick="window.location.hash = '#profile'">
                <i data-lucide="user"></i>
                <span class="nav-label">Profile</span>
            </button>
        </nav>
    </div>

    <!-- Global Modals Container -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-card" class="modal-card">
            <button class="modal-close" onclick="closeModal()">
                <i data-lucide="x"></i>
            </button>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Audio Feedback elements (Optional feedback sound) -->
    <audio id="sound-pop" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" preload="auto" muted></audio>

    <!-- Lucide Icons CDN script -->
    <script src="https://cdn.jsdelivr.net/npm/lucide/dist/umd/lucide.min.js"></script>
    <!-- Socket.io Client for real-time WebSocket messaging -->
    <script src="https://cdn.jsdelivr.net/npm/socket.io-client@4.7.5/dist/socket.io.min.js"></script>
    <!-- App JavaScript Logic -->
    <script type="module" src="app.js"></script>
</body>
</html>
